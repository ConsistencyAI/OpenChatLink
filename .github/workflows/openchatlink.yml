name: OpenChatLink importer

on:
  push:
    paths:
      - 'integrations/phasepal/**'
      - 'openchatlink.py'
      - '.github/workflows/openchatlink.yml'
  pull_request:
    paths:
      - 'integrations/phasepal/**'
      - 'openchatlink.py'
      - '.github/workflows/openchatlink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s integrations/phasepal/tests -v
      - run: python openchatlink.py --help
      - run: python -m pip install ./integrations/phasepal
      - run: openchatlink --version
