name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'integrations/phasepal/**'
      - 'phasepal-extension/**'
      - '.github/workflows/extension.yml'
      - 'openchatlink.py'
      - '.github/workflows/openchatlink.yml'
      - 'examples/openchatlink.json'
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'integrations/phasepal/**'
      - 'phasepal-extension/**'
      - '.github/workflows/extension.yml'
      - 'openchatlink.py'
      - '.github/workflows/openchatlink.yml'
      - 'examples/openchatlink.json'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

  adapter-tests:
    name: Adapter fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run adapters/cursor/test.js
      - run: bun run adapters/gemini-cli/test.js
      - run: bun run adapters/workbuddy/test.js
